# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Asp.Versioning.OpenApi 10.x requires Microsoft.OpenApi < 3.0, but
      # Microsoft.AspNetCore.OpenApi 11.x requires Microsoft.OpenApi >= 3.11.
      # Remove once Asp.Versioning supports .NET 11 / Microsoft.OpenApi 3.x:
      # https://github.com/dotnet/aspnet-api-versioning/issues/1239
      - dependency-name: "Microsoft.AspNetCore.OpenApi"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/src/DotNetStarterProjectTemplate.Api"
    schedule:
      interval: "weekly"
    groups:
      docker-api:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/src/DotNetStarterProjectTemplate.Worker"
    schedule:
      interval: "weekly"
    groups:
      docker-worker:
        patterns:
          - "*"
